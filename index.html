<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Roamy" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Roamy — 旅のすべてを、これひとつで。</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="appbar">
    <a class="brand" href="#"><span class="brand-mark"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Roamy"><defs><linearGradient id="rgHead" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315ff4"/><stop offset="1" stop-color="#865af2"/></linearGradient></defs><rect width="512" height="512" rx="144" fill="url(#rgHead)"/><g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"><path d="M170 156 V 366"/><path d="M170 160 H 232 C 292 160 294 248 236 252 L 202 252"/><path d="M228 250 C 270 306 286 330 300 336 C 330 348 348 250 388 154"/></g><path d="M404 138 L 342 150 L 370 176 L 376 210 Z" fill="#fff"/></svg></span><span>Roamy</span></a>
    <div class="top-actions">
      <button class="lang-btn" id="langBtn">EN</button>
      <button class="avatar">KT</button>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button class="tab active" data-screen="plan"><span>▤</span><small data-i18n="tab.plan">プラン</small></button>
    <button class="tab" data-screen="discover"><span>⌕</span><small data-i18n="tab.discover">見つける</small></button>
    <button class="fab" id="fabBtn" aria-label="新しい旅">✦</button>
    <button class="tab" data-screen="shiori"><span>▤</span><small data-i18n="tab.shiori">しおり</small></button>
    <button class="tab" data-screen="tips"><span>ⓘ</span><small data-i18n="tab.tips">お役立ち</small></button>
  </nav>

  <div class="sheet" id="searchSheet" aria-hidden="true"></div>
  <div class="sheet" id="planSheet" aria-hidden="true"></div>
  <div class="sheet" id="navSheet" aria-hidden="true"></div>
  <div class="sheet" id="subSheet" aria-hidden="true"></div>
  <div class="toast" id="toast"><span>✓</span><p></p></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
